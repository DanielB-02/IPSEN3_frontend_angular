name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        run: npx ng build --configuration production

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start dev server
        run: npx ng serve --host 127.0.0.1 --port 4200 > ng-serve.log 2>&1 &
      - name: Wait for dev server
        run: timeout 180 bash -c 'until curl -sf http://127.0.0.1:4200 > /dev/null; do sleep 2; done'
      - name: Cypress (backend calls are stubbed)
        run: npx cypress run --config baseUrl=http://127.0.0.1:4200
      - name: Dev server log
        if: failure()
        run: cat ng-serve.log
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
